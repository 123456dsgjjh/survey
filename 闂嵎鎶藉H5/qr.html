<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生成活动二维码</title><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#fff7ec;margin:0;padding:30px}.box{max-width:520px;margin:auto;background:#fff;padding:24px;border-radius:20px}input,button{width:100%;padding:13px;border-radius:12px;font-size:16px}input{border:1px solid #ddd;margin:10px 0 14px}button{border:0;background:#2b211a;color:#fff;font-weight:700}canvas{display:block;margin:24px auto;max-width:100%}</style></head><body><div class="box"><h2>活动二维码</h2><p>把正式网站网址粘进来，点击生成，再用手机扫码测试。</p><input id="url" placeholder="https://你的域名/..."><button id="go">生成二维码</button><canvas id="qr"></canvas></div><script>document.getElementById('go').onclick=()=>{const u=document.getElementById('url').value.trim();if(!u)return alert('请输入网站网址');QRCode.toCanvas(document.getElementById('qr'),u,{width:320,margin:2},e=>e&&alert(e.message))}</script></body></html>
